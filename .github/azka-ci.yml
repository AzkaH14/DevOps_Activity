name: React CI / Build / Docker / Deploy to Render

on:
  push:
    branches:
      - Azka-branch

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run lint check
        run: npm run lint

      - name: Build project
        run: npm run build

  docker-build:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-react-app:latest .

  deploy-to-render:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        uses: render-oss/render-action@v1
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

  notify:
    needs: deploy-to-render
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        run: echo "✅ Deployment completed successfully for ${{ github.ref }}"
